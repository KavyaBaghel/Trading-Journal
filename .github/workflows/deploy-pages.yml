name: Deploy Journall to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build optimized site (bundle CSS and JS)
        id: build
        continue-on-error: true
        run: |
          set -e
          rm -rf dist
          mkdir dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='dist' ./ dist/
          node scripts/build-site.mjs dist
          cp dist/index.html /tmp/index.css-only.html
          if ! node scripts/bundle-js.mjs dist; then
            echo "JS bundling failed; keeping CSS-only build"
            cp /tmp/index.css-only.html dist/index.html
            rm -f dist/js/bundle-*.js
          fi

      - name: Upload optimized site
        if: steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload original site (fallback if build failed)
        if: steps.build.outcome != 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
