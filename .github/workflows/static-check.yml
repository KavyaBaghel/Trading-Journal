name: Static check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check index.html, script references and syntax
        run: node scripts/check-static.mjs .

      - name: Unit test for js/trade-math.js
        run: node tests/unit/trade-math.test.cjs
