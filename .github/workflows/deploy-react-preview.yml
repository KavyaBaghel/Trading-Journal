name: Deploy Journall React Preview

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'journall-react/**'
      - '.github/workflows/deploy-react-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: journall-react

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: journall-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React preview
        run: npm run build

      - name: Deploy React preview to isolated branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./journall-react/docs
          publish_branch: gh-pages-react-preview
          force_orphan: true
